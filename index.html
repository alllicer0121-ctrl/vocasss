<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2학기 영어 단어장</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f5f7;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto}
header{padding:18px 18px 10px;text-align:center}
h1{font-size:20px;margin:0 0 8px}
.progress{font-size:13px;color:#777}
.bar{height:6px;background:#e4e4e7;border-radius:9px;margin:10px 18px 0;overflow:hidden}
.fill{height:100%;width:0;background:#222;transition:.2s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 18px}
.card{width:min(100%,620px);height:min(62vh,460px);min-height:320px;background:white;border-radius:28px;box-shadow:0 10px 35px #00000012;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;user-select:none;touch-action:none;transition:transform .18s,opacity .18s;overflow:auto}
.card.swipe-left{transform:translateX(-120%) rotate(-8deg);opacity:0}
.card.swipe-right{transform:translateX(120%) rotate(8deg);opacity:0}
.word{font-size:clamp(25px,6.5vw,44px);font-weight:750;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.hint{margin-top:18px;color:#999;font-size:13px}
.hint2{display:none;margin-top:14px;color:#b7b7bf;font-size:12px}
.card.stage1 .hint2{display:block}
.meaning{margin-top:24px;font-size:clamp(19px,4.6vw,27px);font-weight:600;text-align:center;line-height:1.4;color:#333;display:none}
.card.stage1 .meaning{display:block}
.card.stage1 .hint,.card.stage2 .hint{display:none}
.synant{display:none;margin-top:6px;width:100%;max-width:460px;text-align:center}
.card.stage2 .synant{display:block}
.synant .row{margin:16px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.synant .tag{display:inline-block;font-weight:800;font-size:15px;padding:5px 14px;border-radius:10px}
.synant .tag.syn{background:#e6f7ec;color:#12894f}
.synant .tag.ant{background:#fdeceb;color:#c0392b}
.synant .val{color:#222;font-weight:700;font-size:clamp(20px,5vw,30px);line-height:1.35}
.synant .none{color:#bbb;font-weight:400;font-size:clamp(16px,4vw,22px)}
footer{padding:12px 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
.controls{display:flex;gap:10px;justify-content:center}
button{border:0;border-radius:16px;padding:13px 18px;font-size:15px;font-weight:650;background:#e9e9ec;color:#222}
button:active{transform:scale(.97)}
#know{background:#222;color:white}
#dont{background:#ddd}
.sub{margin-top:9px;color:#999;font-size:12px}
.summary{display:none;position:fixed;inset:0;background:#f5f5f7;z-index:5;padding:35px 22px;overflow:auto;text-align:center}
.summary h2{margin-top:20px}
.stats{font-size:18px;line-height:1.8;margin:20px}
.unknown{max-width:620px;margin:20px auto;text-align:left;background:white;border-radius:18px;padding:18px}
.unknown div{padding:7px 0;border-bottom:1px solid #eee}
.position{margin-top:8px;font-size:12px;color:#aaa}
.top{display:flex;justify-content:flex-start;margin-bottom:8px}
#listBtn{padding:9px 13px;border-radius:12px;background:#e9e9ec;font-size:14px}
.wordList{display:none;position:fixed;inset:0;z-index:20;background:#f5f5f7;overflow:auto;padding:20px 16px calc(30px + env(safe-area-inset-bottom))}
.wordList.show{display:block}
.listHeader{position:sticky;top:0;z-index:2;background:#f5f5f7;padding:5px 0 15px;display:flex;align-items:center;justify-content:space-between}
.listHeader h2{margin:0;font-size:21px}
.closeList{padding:9px 13px;border-radius:12px}
.listSearch{width:100%;border:0;outline:0;background:white;border-radius:14px;padding:13px 15px;font-size:15px;margin-bottom:12px}
.wordItems{display:flex;flex-direction:column;gap:7px}
.wordItem{background:white;border-radius:14px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer}
.wordItem:active{transform:scale(.98)}
.wordNumber{min-width:38px;color:#999;font-size:12px}
.wordEnglish{font-weight:700;font-size:15px}
.wordKorean{color:#777;font-size:13px;margin-top:3px}
.wordItem.known{border-left:4px solid #34c759}
.wordItem.unknown{border-left:4px solid #ff3b30}
.wordBadge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.wordBadge.known{background:#34c759;color:white}
.wordBadge.unknown{background:#ff3b30;color:white}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top"><button id="listBtn">☰ 단어 목록</button></div>
<h1>2학기 영어 단어장</h1>
<div class="progress" id="progress">1 / 514</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="position">↕️ 위아래로 밀어서 단어 이동</div>
</header>
<main>
<div class="card" id="card">
<div class="word" id="word"></div>
<div class="hint">단어를 터치하면 뜻이 나와요</div>
<div class="hint2">한 번 더 터치하면 동의어·반의어가 나와요</div>
<div class="meaning" id="meaning"></div>
<div class="synant" id="synant"></div>
</div>
</main>
<footer>
<div class="controls">
<button id="know">← 알았다</button>
<button id="dont">몰랐다 →</button>
</div>
<div class="sub">카드를 왼쪽으로 밀면 「알았다」 · 오른쪽으로 밀면 「몰랐다」</div>
</footer>
</div>

<div class="summary" id="summary">
<h2>끝! 🎉</h2>
<div class="stats" id="stats"></div>
<div class="unknown" id="unknown"></div>
<button onclick="restart()">전체 다시 보기</button>
<button id="reviewUnknown" onclick="startReviewUnknown()" style="display:none;margin-top:10px;">몰랐던 단어만 보기</button>
<button onclick="resetAll()" style="margin-top:10px;">전체 초기화</button>
</div>

<div class="wordList" id="wordList">
<div class="listHeader">
<h2>단어 목록</h2>
<button class="closeList" id="closeListBtn">닫기</button>
</div>
<input class="listSearch" id="listSearch" placeholder="영어 또는 한글 뜻 검색">
<div class="wordItems" id="wordItems"></div>
</div>

/* =========================================================
   중복 단어 합치기 (뜻도 모으기) + 동의어/반의어 붙이기
========================================================= */
const words = (function(){
  const map = new Map();
  rawWords.forEach(w => {
    const key = w.en.toLowerCase().trim();
    if(map.has(key)){
      const existing = map.get(key);
      const meanings = new Set();
      existing.ko.split(",").forEach(m => meanings.add(m.trim()));
      w.ko.split(",").forEach(m => meanings.add(m.trim()));
      existing.ko = [...meanings].join(", ");
    } else {
      map.set(key, {en: w.en, ko: w.ko});
    }
  });
  const list = [...map.values()];
  list.forEach(w => {
    const info = SYNANT[w.en.toLowerCase().trim()] || {s:"",a:""};
    w.syn = info.s || "";
    w.ant = info.a || "";
  });
  return list;
})();

/* =========================================================
   상태 관리
========================================================= */
const SAVE_KEY = "english_vocab_progress_v4";

let idx = 0;
let stage = 0; // 0: 힌트, 1: 뜻, 2: 동의어/반의어
let wordStatus = {}; // { wordIndex: true(알았다) / false(몰랐다) }
let reviewDeck = null; // null이면 전체, 배열이면 몰랐던 단어만
let touchStartX = 0, touchStartY = 0, moved = false;

function currentDeck(){ return reviewDeck ? reviewDeck : words.map((_,i)=>i); }
function deckLength(){ return currentDeck().length; }
function currentWordIndex(){ return currentDeck()[idx]; }

const el = {
  word: document.getElementById('word'),
  meaning: document.getElementById('meaning'),
  synant: document.getElementById('synant'),
  card: document.getElementById('card'),
  progress: document.getElementById('progress'),
  fill: document.getElementById('fill'),
  summary: document.getElementById('summary'),
  stats: document.getElementById('stats'),
  unknown: document.getElementById('unknown'),
  reviewUnknown: document.getElementById('reviewUnknown'),
  wordList: document.getElementById('wordList'),
  wordItems: document.getElementById('wordItems'),
  listSearch: document.getElementById('listSearch')
};

function synantHTML(w){
  const synRow = `<div class="row"><span class="tag syn">동의어</span><span class="val ${w.syn?'':'none'}">${w.syn || '해당 없음'}</span></div>`;
  const antRow = `<div class="row"><span class="tag ant">반의어</span><span class="val ${w.ant?'':'none'}">${w.ant || '해당 없음'}</span></div>`;
  return synRow + antRow;
}

function render(){
  const w = words[currentWordIndex()];
  el.word.textContent = w.en;
  el.meaning.textContent = w.ko;
  el.synant.innerHTML = synantHTML(w);
  stage = 0;
  el.card.classList.remove('stage1','stage2');
  el.card.style.transform = '';
  el.card.style.opacity = '';
  el.progress.textContent = `${idx+1} / ${deckLength()}`;
  el.fill.style.width = `${((idx)/deckLength())*100}%`;
  saveProgress();
}

function tapReveal(){
  stage = (stage+1) % 3;
  el.card.classList.toggle('stage1', stage>=1);
  el.card.classList.toggle('stage2', stage>=2);
}

function goNext(known){
  const wi = currentWordIndex();
  wordStatus[wi] = known;
  const cls = known ? 'swipe-left' : 'swipe-right';
  el.card.classList.add(cls);
  setTimeout(() => {
    el.card.classList.remove(cls);
    idx++;
    if(idx >= deckLength()){
      showSummary();
    } else {
      render();
    }
  }, 180);
}

function navigate(delta){
  const next = idx + delta;
  if(next < 0 || next >= deckLength()) return;
  idx = next;
  render();
}

document.getElementById('know').addEventListener('click', () => goNext(true));
document.getElementById('dont').addEventListener('click', () => goNext(false));

el.card.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  moved = false;
});
el.card.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if(Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
  if(Math.abs(dx) > Math.abs(dy)){
    el.card.style.transform = `translateX(${dx}px) rotate(${dx/20}deg)`;
    el.card.style.opacity = String(1 - Math.min(Math.abs(dx)/300, 0.6));
  }
});
el.card.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  el.card.style.transform = '';
  el.card.style.opacity = '';
  if(!moved){
    tapReveal();
    return;
  }
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 70){
    goNext(dx < 0); // 왼쪽으로 밀면 알았다(true), 오른쪽으로 밀면 몰랐다(false)
  } else if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 60){
    navigate(dy < 0 ? 1 : -1); // 위로 밀면 다음, 아래로 밀면 이전
  }
});
// 마우스(데스크톱)에서도 탭으로 뜻 보기
el.card.addEventListener('click', e => {
  if(moved) return;
  // touchend에서 이미 처리된 경우(모바일) 중복 방지
  if('ontouchstart' in window) return;
  tapReveal();
});

/* =========================================================
   요약 화면
========================================================= */
function showSummary(){
  const deck = currentDeck();
  let known = 0, unknownList = [];
  deck.forEach(i => {
    if(wordStatus[i]) known++;
    else if(wordStatus[i] === false) unknownList.push(i);
  });
  el.stats.innerHTML = `총 ${deck.length}개 중<br><b>${known}개</b> 알았어요 · <b>${unknownList.length}개</b> 몰랐어요`;
  el.unknown.innerHTML = unknownList.length
    ? unknownList.map(i => `<div><b>${words[i].en}</b> - ${words[i].ko}</div>`).join('')
    : '<div>몰랐던 단어가 없어요! 👏</div>';
  el.reviewUnknown.style.display = unknownList.length ? 'inline-block' : 'none';
  document.querySelector('.app').style.display = 'none';
  el.summary.style.display = 'block';
}

function restart(){
  idx = 0;
  reviewDeck = null;
  el.summary.style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
  render();
}

function startReviewUnknown(){
  const deck = currentDeck();
  reviewDeck = deck.filter(i => wordStatus[i] === false);
  idx = 0;
  el.summary.style.display = 'none';
  document.querySelector('.app').style.display = 'flex';
  render();
}

function resetAll(){
  if(!confirm('모든 학습 기록을 초기화할까요?')) return;
  wordStatus = {};
  localStorage.removeItem(SAVE_KEY);
  restart();
}

/* =========================================================
   단어 목록
========================================================= */
function renderWordList(filter){
  const f = (filter || '').trim().toLowerCase();
  const items = words.map((w,i) => ({w,i}))
    .filter(({w}) => !f || w.en.toLowerCase().includes(f) || w.ko.toLowerCase().includes(f));
  el.wordItems.innerHTML = items.map(({w,i}) => {
    const st = wordStatus[i];
    const stCls = st === true ? 'known' : (st === false ? 'unknown' : '');
    const badge = st === true ? '<span class="wordBadge known">알았다</span>' : (st === false ? '<span class="wordBadge unknown">몰랐다</span>' : '');
    return `<div class="wordItem ${stCls}" data-idx="${i}">
      <div class="wordNumber">${i+1}</div>
      <div>
        <div class="wordEnglish">${w.en}</div>
        <div class="wordKorean">${w.ko}</div>
      </div>
      ${badge}
    </div>`;
  }).join('');
  [...el.wordItems.querySelectorAll('.wordItem')].forEach(item => {
    item.addEventListener('click', () => {
      const wi = Number(item.dataset.idx);
      reviewDeck = null;
      idx = wi;
      closeList();
      document.querySelector('.app').style.display = 'flex';
      el.summary.style.display = 'none';
      render();
    });
  });
}

function openList(){
  renderWordList(el.listSearch.value);
  el.wordList.classList.add('show');
}
function closeList(){
  el.wordList.classList.remove('show');
}

document.getElementById('listBtn').addEventListener('click', openList);
document.getElementById('closeListBtn').addEventListener('click', closeList);
el.listSearch.addEventListener('input', () => renderWordList(el.listSearch.value));

/* =========================================================
   저장 / 불러오기
========================================================= */
function saveProgress(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({idx, wordStatus, reviewDeck}));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data && typeof data === 'object'){
      wordStatus = data.wordStatus || {};
      reviewDeck = data.reviewDeck || null;
      idx = Math.min(data.idx || 0, deckLength()-1);
      if(idx < 0) idx = 0;
    }
  }catch(e){}
}

/* =========================================================
   초기화
========================================================= */
loadProgress();
render();
</script>
